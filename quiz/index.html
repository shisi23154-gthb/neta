<!doctype html>
<html lang="ja">
<head>
  <script src="../assets/access-gate.js?v=20260729-eye"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>平清盛はさっ | ピザッツ</title>
  <link rel="stylesheet" href="../assets/site.css">
  <link rel="stylesheet" href="quiz.css?v=20260729-mincho">
</head>
<body class="workspace-page quiz-feature-page">
  <header class="site-header">
    <a class="brand" href="../" aria-label="ピザッツ 管理トップ">
      <span class="brand-mark" aria-hidden="true">P</span>
      <span>
        <span class="brand-title">ピザッツ</span>
        <span class="brand-subtitle">クイズ</span>
      </span>
    </a>
    <nav class="top-nav" aria-label="サイト内メニュー">
      <a href="../archive/">Archive</a>
      <a href="./" aria-current="page">Quiz</a>
      <a href="../chatbot/">Chatbot</a>
    </nav>
  </header>

  <main class="quiz-shell">
    <div class="paper-grain" aria-hidden="true"></div>
    <section class="quiz-stage" aria-labelledby="quiz-prompt">
      <article class="quiz-card" id="quiz-card">
        <span id="quiz-crest" class="quiz-crest" aria-hidden="true">平</span>
        <p class="eyebrow">ランダム出題・全2問</p>
        <div class="quiz-rule" aria-hidden="true">
          <span></span>
          <b>問</b>
          <span></span>
        </div>
        <h1 id="quiz-prompt">平清盛はさっ、</h1>
        <div id="choice-list" class="choice-list" aria-label="回答選択肢"></div>
        <p class="quiz-hint">正しいと思う答えをタップ</p>
        <div class="quiz-tools">
          <button id="random-question" class="button" type="button">別の問題</button>
        </div>
      </article>

      <section id="result-panel" class="result-panel" aria-live="polite" hidden>
        <div>
          <p id="result-label" class="kicker">Result</p>
          <h2 id="result-title"></h2>
          <p id="result-copy"></p>
        </div>
        <div id="result-images" class="result-images"></div>
        <div class="result-actions">
          <button id="retry-question" class="button" type="button">もう一度！</button>
          <button id="next-question" class="button next-question-button" type="button">次の問題へ</button>
        </div>
      </section>
    </section>
    <footer class="quiz-footer">KIYOMORI QUIZ · TWO QUESTIONS</footer>
  </main>

  <script src="quiz.js" defer></script>
</body>
</html>
