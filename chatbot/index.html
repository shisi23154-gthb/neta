<!doctype html>
<html lang="ja">
<head>
  <script src="../assets/access-gate.js?v=20260729-eye"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ワタスフーミン、 | ピザッツ</title>
  <link rel="stylesheet" href="../assets/site.css?v=20260729-updates">
  <link rel="stylesheet" href="chatbot.css">
</head>
<body class="workspace-page chatbot-feature-page">
  <header class="site-header">
    <a class="brand" href="../">
      <span class="brand-mark" aria-hidden="true">P</span>
      <span>
        <span class="brand-title">ピザッツ</span>
        <span class="brand-subtitle">チャットボット</span>
      </span>
    </a>
    <nav class="top-nav" aria-label="サイト内メニュー">
      <a href="../archive/">Archive</a>
      <a href="../quiz/">Quiz</a>
      <a href="./" aria-current="page">Chatbot</a>
      <a href="../updates/">Updates</a>
    </nav>
  </header>

  <main class="fumin-site-shell">
    <section class="chat-app" aria-label="フーミンとのチャット">
      <header class="chat-header">
        <div class="header-title">
          <span class="presence-dot" aria-hidden="true"></span>
          <div>
            <h1>ワタスフーミン、</h1>
            <p>質問すると一言だけ返しますんて、</p>
          </div>
        </div>
        <div class="header-actions">
          <button id="open-manager" type="button">学習 0件</button>
          <button id="clear-conversation" type="button">履歴を消す</button>
        </div>
      </header>

      <div class="chat-notice">
        過去の会話を遡って似た質問への回答を学習します。修正した回答はサイト全体で共有されます。
        <span id="learning-error" class="learning-error" hidden></span>
      </div>

      <div id="message-list" class="message-list" aria-live="polite"></div>

      <form id="composer" class="composer">
        <input
          id="chat-input"
          type="text"
          placeholder="ワタスフーミン、思ってませんのて、"
          aria-label="フーミンへの質問"
          autocomplete="off"
          maxlength="180"
        >
        <button id="send-button" type="submit" disabled>てねっ！</button>
      </form>
    </section>
  </main>

  <div id="correction-modal" class="modal-backdrop" hidden>
    <section class="modal-card correction-modal" role="dialog" aria-modal="true" aria-labelledby="correction-title">
      <div class="modal-heading">
        <div>
          <p class="modal-eyebrow">フーミンを育てる</p>
          <h2 id="correction-title">回答修正しますんて</h2>
        </div>
        <button class="close-button" type="button" aria-label="閉じる" data-close-modal>×</button>
      </div>
      <div id="correction-question" class="question-preview"></div>
      <label class="field-label" for="correction-answer">正しいフーミンの回答</label>
      <textarea id="correction-answer" rows="4" maxlength="320"></textarea>
      <p class="field-help">保存時に濁点だけを外し、半濁点は残します。口癖がない場合は内容に合わせて自動追加します。</p>
      <div class="modal-actions">
        <button class="secondary-button" type="button" data-close-modal>やめる</button>
        <button id="save-correction" class="primary-button" type="button">記憶しますんて</button>
      </div>
    </section>
  </div>

  <div id="manager-modal" class="modal-backdrop" hidden>
    <section class="modal-card manager-modal" role="dialog" aria-modal="true" aria-labelledby="manager-title">
      <div class="modal-heading manager-heading">
        <div>
          <p class="modal-eyebrow">この端末から登録した共有学習</p>
          <h2 id="manager-title">フーミンの記憶</h2>
        </div>
        <button class="close-button" type="button" aria-label="閉じる" data-close-modal>×</button>
      </div>
      <div id="learning-list" class="learning-list"></div>
    </section>
  </div>

  <script src="chatbot.js?v=20260729-history-learning" defer></script>
</body>
</html>
