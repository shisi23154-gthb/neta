<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ピザッツ 管理トップ</title>
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./" aria-label="ピザッツ 管理トップ">
      <span class="brand-mark" aria-hidden="true">P</span>
      <span>
        <span class="brand-title">ピザッツ</span>
        <span class="brand-subtitle">管理トップ</span>
      </span>
    </a>
    <nav class="top-nav" aria-label="サイト内メニュー">
      <a href="archive/">Archive</a>
      <a href="quiz/">Quiz</a>
      <a href="chatbot/">Chatbot</a>
    </nav>
  </header>

  <main class="home-shell">
    <section class="overview">
      <div class="overview-copy">
        <p class="eyebrow">NETA Site</p>
        <h1>アーカイブを中心に、機能を分けて管理</h1>
        <p class="lead">昔のホームページ一式はアーカイブにまとめ、クイズとチャットボットは別フォルダで育てます。</p>
      </div>
      <div class="overview-stats" aria-label="現在の構成">
        <span><strong>Archive</strong>公開中</span>
        <span><strong>Quiz</strong>準備中</span>
        <span><strong>Chatbot</strong>公開中</span>
      </div>
    </section>

    <section class="workspace-grid" aria-label="ワークスペース">
      <article class="workspace-card archive-card">
        <a class="workspace-media" href="archive/" aria-label="アーカイブを開く">
          <img src="archive/なへ公園/data01.gif" alt="" loading="lazy">
        </a>
        <div class="workspace-body">
          <p class="kicker">Archive</p>
          <h2>アーカイブ</h2>
          <p>HTML、画像、音声、テキストをまとめた保管エリア。</p>
          <a class="button primary" href="archive/">開く</a>
        </div>
      </article>

      <article class="workspace-card quiz-card">
        <div class="workspace-symbol" aria-hidden="true">
          <span>Q</span>
        </div>
        <div class="workspace-body">
          <p class="kicker">Quiz</p>
          <h2>クイズ</h2>
          <p>問題、選択肢、採点まわりをここで分けて管理。</p>
          <a class="button" href="quiz/">開く</a>
        </div>
      </article>

      <article class="workspace-card chatbot-card">
        <a class="workspace-media" href="chatbot/" aria-label="チャットボットを開く">
          <img src="chatbot/avatars/fumin-01.jpeg" alt="" loading="lazy">
        </a>
        <div class="workspace-body">
          <p class="kicker">Chatbot</p>
          <h2>ワタスフーミン、</h2>
          <p>質問にフーミンが一言返すチャットボット。</p>
          <a class="button" href="chatbot/">開く</a>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
